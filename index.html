<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Campo Harmônico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="wheel-container">
            <!-- Roda giratória -->
            <div id="wheel" class="wheel"></div>
            
            <!-- Máscara cinza vazada -->
            <div class="mask"></div>
            
            <!-- Numerais romanos fixos na máscara -->
            <div class="labels">
                <span class="deg-iv">IV</span>
                <span class="deg-v">V</span>
                <span class="deg-ii">II</span>
                <span class="deg-iii">III</span>
                <span class="deg-vi-vii">VI / VII</span>
            </div>
        </div>
        <p class="instruction">Use as setas &larr; e &rarr; do notebook para trocar de tom.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
