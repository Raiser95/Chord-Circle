<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Campo Harmônico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="current-key">Tom: C</h1>
            <p class="instruction">Use as setas &larr; e &rarr; para trocar de tom</p>
        </header>

        <div class="harmonic-grid">
            <!-- Linha 1: Acordes Maiores -->
            <div class="chord-box" id="box-iv">
                <span class="degree">IV</span>
                <span class="chord">F</span>
            </div>
            <div class="chord-box tonic" id="box-i">
                <span class="degree">I</span>
                <span class="chord">C</span>
            </div>
            <div class="chord-box" id="box-v">
                <span class="degree">V</span>
                <span class="chord">G</span>
            </div>
            
            <!-- Linha 2: Acordes Menores -->
            <div class="chord-box minor" id="box-ii">
                <span class="degree">ii</span>
                <span class="chord">Dm</span>
            </div>
            <div class="chord-box minor" id="box-vi">
                <span class="degree">vi</span>
                <span class="chord">Am</span>
            </div>
            <div class="chord-box minor" id="box-iii">
                <span class="degree">iii</span>
                <span class="chord">Em</span>
            </div>

            <!-- Linha 3: Acorde Diminuto -->
            <div class="chord-box dim" id="box-vii">
                <span class="degree">vii°</span>
                <span class="chord">B°</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
